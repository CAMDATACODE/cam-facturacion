# ---------------------------------------------------------------------
# Configuración. Cada valor se puede cambiar con una variable de entorno
# (la que va dentro de ${...}); después de los dos puntos está el valor local por defecto.
# ---------------------------------------------------------------------

# MySQL. La zona -05:00 (Bogotá) se fija en la conexión.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/cam_facturacion?connectionTimeZone=-05:00&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

server.port=${PORT:8080}

# Sesiones en MySQL (tablas SPRING_SESSION de 01_esquema.sql), 2 horas, cookie HttpOnly y SameSite=Lax.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=2h
server.servlet.session.timeout=2h
server.servlet.session.cookie.name=cam.sid
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En la publicación con HTTPS: COOKIE_SECURE=true y FORWARD_HEADERS=native
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.forward-headers-strategy=${FORWARD_HEADERS:none}

spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never

# Aplicación
cam.app-url=${APP_URL:}
cam.login-max-intentos=${LOGIN_MAX_INTENTOS:10}
# Contraseñas que se asignan al arrancar a las cuentas marcadas 'PENDIENTE' en la base.
# Cámbielas antes de publicar.
cam.admin-password=${ADMIN_PASSWORD:1234}
cam.propietario-password=${PROPIETARIO_PASSWORD:12345}
cam.propietarios-password=${PROPIETARIOS_PASSWORD:12345}
